[package]
name = "kairos-arcade-launcher"
version = "0.1.0"
edition = "2021"
description = "Launcher y actualizador firmado para Kairos Arcade"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = "2.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.12"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
